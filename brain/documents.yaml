  # ---- Tier 1: generated from structured sources (see brain/ingest.py) ----
  - id_prefix: ercot-gis
    glob: corpus/ercot/*_ercot_gis_report.xlsx
    title: "ERCOT Generation Interconnection Status report, {month}"
    kind: queue_report
    tier: 1
    publisher: ERCOT
    url: https://www.ercot.com/mp/data-products/data-product-details?id=PG7-200-ER
    notes: "Only rows mentioning Kilby or Energy Forge One are ingested, one page per sheet. Includes the unrelated Haskell County 'Kilby Station' rows on purpose."
  - id_prefix: tceq-pending
    glob: corpus/wayback/tceq-pending/tceq-pending_*.html
    title: "TCEQ pending NSR permit list (Wayback Machine snapshot), {date}"
    kind: status_snapshot
    tier: 1
    publisher: TCEQ via Internet Archive
    url: https://www.tceq.texas.gov/assets/public/permitting/air/reports/applications/nsr-pending-permits.html

