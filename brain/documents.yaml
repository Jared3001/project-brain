# Document registry: every source the brain may cite.
#
# tier: 1 primary regulatory, 2 company statement, 3 press, 4 third party analysis.
# The answer layer prefers lower tier numbers and says when it falls back.
# Files left out on purpose are listed under `excluded` with the reason.

