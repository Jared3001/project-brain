<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Project Kilby record{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6760; --rule: #e4e0d8;
  --accent: #1f4e79; --mark: #fff1a8;
  --found: #2f6b3a; --found-bg: #e7f1e8;
  --conflict: #9a4a00; --conflict-bg: #fbeedd;
  --missing: #6b6760; --missing-bg: #efede8;
  --ins: #1d6b34; --ins-bg: #dff3e3; --del: #a32c1f; --del-bg: #fbe3df;
  --soft: #f3f1ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #1f1e1c; --ink: #ece9e3; --muted: #a29d94; --rule: #34322e;
    --accent: #8db8e0; --mark: #5a4b00;
    --found: #8fd19b; --found-bg: #1f3323;
    --conflict: #f0b46e; --conflict-bg: #3a2a16;
    --missing: #a29d94; --missing-bg: #2a2926;
    --ins: #8fd19b; --ins-bg: #1c3322; --del: #f2a59d; --del-bg: #3b1d1a;
    --soft: #252421;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
header.top { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 8px; }
header.top h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
header.top p { margin: 0; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin: 10px 0 0; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  margin: 34px 0 6px; font-weight: 600; }
.field { display: grid; grid-template-columns: 200px 1fr; gap: 4px 20px; padding: 14px 0;
  border-top: 1px solid var(--rule); }
.label { font-weight: 600; }
.status { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 1px 7px; border-radius: 3px; margin-top: 4px; }
.status.found { color: var(--found); background: var(--found-bg); }
.status.conflict { color: var(--conflict); background: var(--conflict-bg); }
.status.not_found, .status.not_extracted { color: var(--missing); background: var(--missing-bg); }
.value { margin: 0 0 8px; }
.value:last-child { margin-bottom: 0; }
.v { font-size: 17px; }
.basis { color: var(--muted); font-size: 13px; }
.chip { font-size: 12px; text-decoration: none; border: 1px solid var(--rule); border-radius: 3px;
  padding: 0 6px; margin-left: 6px; white-space: nowrap; background: var(--panel); }
.chip:hover { border-color: var(--accent); }
.tier { color: var(--muted); font-size: 11px; margin-left: 4px; }
.note { font-size: 13px; color: var(--conflict); margin: 6px 0 0; }
details { margin-top: 8px; font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
details ul { margin: 6px 0 0; padding-left: 18px; }
details li { margin: 3px 0; }
.was { text-decoration: line-through; text-decoration-color: var(--muted); }
.src-head { border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 16px; }
.src-head h1 { font-size: 20px; margin: 8px 0 4px; }
.quote { border-left: 3px solid var(--accent); padding: 4px 12px; margin: 12px 0; background: var(--panel); }
pre.page { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--panel); border: 1px solid var(--rule); padding: 16px; border-radius: 4px; }
mark { background: var(--mark); color: inherit; padding: 1px 0; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 12px; }
.wrap.wide { max-width: 1280px; }
.wrap.embed { padding: 12px; }
.ask-form { display: flex; gap: 8px; margin: 16px 0 8px; }
.ask-form input { flex: 1; font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); }
.ask-form button { font: inherit; padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 4px; cursor: pointer; }
.samples { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.samples a { text-decoration: none; border: 1px solid var(--rule); border-radius: 3px; padding: 1px 8px; color: var(--muted); }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
.answer p { margin: 0 0 10px; font-size: 16px; }
.cite { font-size: 11px; vertical-align: 2px; text-decoration: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; margin-left: 2px; }
.cite.on { border-color: var(--accent); }
.sources { list-style: none; padding: 0; margin: 14px 0 0; font-size: 13px; }
.sources li { padding: 6px 0; border-top: 1px solid var(--rule); }
.tierlab { font-size: 11px; color: var(--muted); }
.checked { font-size: 13px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; }
iframe.src { width: 100%; height: 78vh; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); }
.held { border-left: 3px solid var(--conflict); padding: 6px 12px; background: var(--conflict-bg); border-radius: 0; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 8px 0 10px; }
.score { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; }
.score .n { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
.score .label { font-weight: 600; margin-bottom: 2px; }
.tablewrap { overflow-x: auto; }
table.runs { width: 100%; border-collapse: collapse; font-size: 14px; }
table.runs th, table.runs td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-top: 1px solid var(--rule); }
table.runs th { font-size: 12px; color: var(--muted); font-weight: 600; }
.caveats { padding-left: 18px; margin-top: 10px; }
.caveats li { margin: 4px 0; }
details.case { border-top: 1px solid var(--rule); padding: 8px 0; }
details.case summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.case summary::-webkit-details-marker { display: none; }
.case .q { flex: 1; }
.case-body { padding: 6px 0 4px 64px; }
.case-body p { margin: 6px 0; }
.verdict { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 3px; min-width: 54px; text-align: center; }
.verdict.pass { color: var(--found); background: var(--found-bg); }
.verdict.fail { color: #b3261e; background: #fbe4e2; }
.verdict.declined { color: var(--conflict); background: var(--conflict-bg); }
@media (prefers-color-scheme: dark) { .verdict.fail { color: #f2a59d; background: #3b1d1a; } }
@media (max-width: 640px) { .case-body { padding-left: 0; } }
@media (max-width: 900px) { .panes { grid-template-columns: 1fr; } iframe.src { height: 60vh; } }
@media (max-width: 640px) {
  .field { grid-template-columns: 1fr; }
  .chip { white-space: normal; }
}

/* ---- site nav ---- */
nav.site { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--rule); }
nav.site .in { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 4px; height: 52px; overflow-x: auto; }
nav.site .brand { font-weight: 700; letter-spacing: -0.01em; margin-right: 18px; white-space: nowrap; color: var(--ink); text-decoration: none; }
nav.site .brand span { color: var(--muted); font-weight: 500; }
nav.site a.tab { color: var(--muted); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
nav.site a.tab:hover { color: var(--ink); background: var(--soft); }
nav.site a.tab.on { color: var(--ink); background: var(--soft); font-weight: 600; }
nav.site .sep { width: 1px; height: 20px; background: var(--rule); margin: 0 6px; }

/* ---- project header ---- */
.ph { margin: 18px 0 6px; }
.phcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.phcard { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
a.phcard[href]:hover { border-color: var(--accent); }
.phcard .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.phcard .v { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.phcard .s { font-size: 12px; color: var(--muted); }
.phcard.conflict .s { color: var(--conflict); font-weight: 600; }
.phcard.accent .v { color: var(--accent); }
.phrecent { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin: 12px 0 0; font-size: 14px; padding: 10px 14px; background: var(--soft); border-radius: 8px; }
.phrecent a { color: var(--ink); text-decoration: none; }
.phrecent a:hover { color: var(--accent); }
.phrecent .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.phrecent .dotsep { color: var(--muted); }
.phrecent .more { margin-left: auto; color: var(--accent); font-size: 13px; }
.tracks { display: grid; gap: 10px; margin-top: 12px; }
.track { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.tname { font-weight: 700; font-size: 14px; padding-top: 2px; }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.stepper li { position: relative; padding: 0 8px 0 0; }
.stepper li a { color: inherit; text-decoration: none; display: block; }
.stepper li a:hover .sl { color: var(--accent); }
.stepper .dot { display: block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule); background: var(--panel); position: relative; z-index: 1; margin-bottom: 6px; }
.stepper li::before { content: ""; position: absolute; left: 14px; right: 0; top: 6px; height: 2px; background: var(--rule); }
.stepper li:last-child::before { display: none; }
.stepper li.done .dot { background: var(--found); border-color: var(--found); }
.stepper li.done::before { background: var(--found); }
.stepper li.current .dot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.stepper li.late .dot { background: var(--del); border-color: var(--del); }
.stepper li.risk .dot { background: var(--conflict); border-color: var(--conflict); }
.stepper .sl { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; }
.stepper .sw { display: block; font-size: 12px; color: var(--muted); }
.stepper .sn { display: block; font-size: 11px; font-weight: 600; color: var(--conflict); }
.stepper li.late .sn { color: var(--del); }
.stepper li.todo .sn, .stepper li.done .sn { color: var(--muted); font-weight: 500; }
@media (max-width: 760px) {
  .track { grid-template-columns: 1fr; }
  .stepper { grid-auto-flow: row; gap: 10px; }
  .stepper li { display: block; padding-left: 24px; }
  .stepper .dot { position: absolute; left: 0; top: 2px; }
  .stepper li::before { left: 6px; right: auto; top: 16px; bottom: -12px; width: 2px; height: auto; }
  .phrecent .more { margin-left: 0; }
  .phrecent .dotsep { display: none; }
  .phrecent a { display: block; width: 100%; }
  .phcard .v { font-size: 17px; }
}

/* ---- consistency grid ---- */
table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; width: 100%; min-width: 860px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--rule); padding: 8px 10px; vertical-align: top; text-align: left; }
table.grid thead th { background: var(--panel); font-size: 12px; }
table.grid thead th a { color: var(--ink); text-decoration: none; display: block; }
table.grid thead th .pill { margin-top: 4px; }
table.grid tbody th { font-weight: 600; white-space: nowrap; background: var(--panel); position: sticky; left: 0; z-index: 1; }
table.grid tbody th .party { margin-left: 0; display: block; width: max-content; margin-top: 2px; }
table.grid td a { display: block; color: var(--ink); text-decoration: none; border-radius: 6px; padding: 4px 6px; margin: -4px -6px; }
table.grid td a:hover { background: var(--soft); }
table.grid td.agree a { background: var(--found-bg); }
table.grid td.differ a { background: var(--del-bg); color: var(--del); font-weight: 600; }
table.grid td.earlier a { background: var(--conflict-bg); color: var(--conflict); }
table.grid td.empty { color: var(--rule); }
table.grid .d { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* ---- condition history strip ---- */
.chg { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; margin: 14px 0 0; }
.chg .k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-right: 4px; }
.chg span.c { font-size: 13px; background: var(--soft); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 8px; }
.strip { list-style: none; margin: 0; padding: 0; position: relative; }
.strip > li { position: relative; padding: 0 0 20px 34px; }
.strip > li::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--rule); }
.strip > li:last-child::before { display: none; }
.strip .ico { position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--muted); border: 1px solid var(--rule); }
.strip li.ask .ico { background: var(--soft); color: var(--accent); border-color: var(--accent); }
.strip li.reply .ico { background: var(--found-bg); color: var(--found); border-color: var(--found); }
.strip li.final .ico { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.strip .hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
.strip .hd b { font-size: 14px; }
.strip .hd .mini { font-size: 12px; }
.strip .body { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.strip li.ask .body { border-left: 3px solid var(--accent); }
.strip li.reply .body { border-left: 3px solid var(--found); }
.strip .body.condtext { font-size: 14px; }
.strip details > summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 6px; }

/* ---- ask polish ---- */
.pop { position: absolute; z-index: 50; max-width: 420px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); font-size: 13px; }
.pop .pt { font-weight: 600; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pop .pq { background: var(--mark); padding: 2px 4px; border-radius: 3px; line-height: 1.5; }
.pop .ph2 { font-size: 11px; color: var(--muted); margin-top: 6px; }
details.readline { margin-top: 12px; font-size: 13px; }
details.readline summary { color: var(--muted); }
details.readline ul { margin-top: 6px; }

/* ---- lens pages ---- */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.hero { padding: 8px 0 22px; border-bottom: 1px solid var(--rule); margin-bottom: 8px; }
.hero h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; margin: 6px 0 8px; }
.hero p.lede { font-size: 17px; color: var(--muted); max-width: 760px; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
.stat { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.stat .n { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.stat .l { font-size: 13px; color: var(--muted); }
.sec { margin-top: 36px; }
.sec > h2 { margin: 0 0 4px; }
.sec > p.sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; max-width: 760px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
table.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.spec th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); }
table.spec td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.spec tr:last-child td { border-bottom: 0; }
table.spec td.num, table.spec th.num { text-align: right; }
table.spec tfoot td { font-weight: 600; border-top: 2px solid var(--rule); }
.big { font-size: 18px; font-weight: 600; white-space: nowrap; }
.avg { display: block; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.accepted { color: var(--found); background: var(--found-bg); }
.pill.countered { color: var(--conflict); background: var(--conflict-bg); }
.pill.open { color: var(--missing); background: var(--missing-bg); }
.pill.changed { color: var(--accent); background: var(--soft); border: 1px solid var(--rule); }
.pill.epc { color: var(--accent); border: 1px solid var(--accent); }
.thread { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--rule); }
.thread:first-child { border-top: 0; }
.thread .num { font-weight: 700; font-size: 15px; }
.thread .num a { text-decoration: none; margin-right: 6px; }
.msg { margin: 4px 0; font-size: 14px; }
.msg .who { font-weight: 600; font-size: 13px; }
.msg .who span { color: var(--muted); font-weight: 400; }
.msg.reply { padding-left: 12px; border-left: 2px solid var(--rule); margin-top: 8px; }
.qlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.qlist a { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.qlist a:hover { border-color: var(--accent); }
.locked { background: var(--soft); border: 1px dashed var(--rule); border-radius: 10px; padding: 16px 18px; }
.locked li { margin: 10px 0; font-size: 14px; }
.locked .needs { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
ins { background: var(--ins-bg); color: var(--ins); text-decoration: none; border-radius: 2px; padding: 0 2px; }
del { background: var(--del-bg); color: var(--del); border-radius: 2px; padding: 0 2px; }
.condtext { white-space: pre-wrap; font-size: 15px; line-height: 1.65; }
.diff { font-size: 14px; line-height: 1.75; }
.crow { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.crow .n { font-weight: 700; }
.crow a.t { color: var(--ink); text-decoration: none; }
.crow a.t:hover { color: var(--accent); }
.crow .flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.filters a { font-size: 13px; text-decoration: none; color: var(--muted); border: 1px solid var(--rule); border-radius: 99px; padding: 3px 10px; }
.filters a.on { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.timeline li:first-child { border-top: 0; }
.mini { font-size: 13px; color: var(--muted); }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.lane { display: flex; flex-direction: column; gap: 10px; }
.lane h3 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.lane .who { font-size: 13px; color: var(--muted); margin-top: -6px; }
.lane .links { display: flex; flex-wrap: wrap; gap: 6px; }
.lane .links a { font-size: 13px; text-decoration: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 9px; }
.lane .links a:hover { border-color: var(--accent); }
.lane .asks a { display: block; font-size: 14px; color: var(--ink); text-decoration: none; padding: 5px 0; border-top: 1px solid var(--rule); }
.lane .asks a:hover { color: var(--accent); }
.lane .asks a::before { content: "\2192\00a0"; color: var(--muted); }
.cov { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.cov.good { color: var(--found); } .cov.partial { color: var(--conflict); } .cov.internal { color: var(--missing); }
.alerts { display: grid; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: baseline; font-size: 14px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
.alert:hover { border-color: var(--accent); }
.homeask { display: flex; gap: 8px; margin-top: 18px; max-width: 760px; }
.homeask input { flex: 1; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--ink); }
.homeask button { font: inherit; padding: 12px 18px; border: 0; background: var(--ink); color: var(--bg); border-radius: 8px; cursor: pointer; font-weight: 600; }
.finding { margin-top: 18px; }
.finding .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.finding h3 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.finding .topic { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.finding ul.why { margin: 8px 0 14px; padding-left: 18px; font-size: 15px; }
.finding ul.why li { margin: 4px 0; }
.pill.disagree { color: var(--del); background: var(--del-bg); }
.pill.tension, .pill.changed { color: var(--conflict); background: var(--conflict-bg); border: 0; }
.pill.consistent { color: var(--found); background: var(--found-bg); }
.pill.single { color: var(--missing); background: var(--missing-bg); }
.party { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.q { color: var(--muted); font-size: 13px; font-style: italic; }
tr.odd td { background: var(--soft); }
.pill.done { color: var(--found); background: var(--found-bg); }
.pill.past_due { color: var(--del); background: var(--del-bg); }
.pill.at_risk { color: var(--conflict); background: var(--conflict-bg); }
.pill.due_soon { color: var(--accent); background: var(--soft); border: 1px solid var(--accent); }
.pill.upcoming { color: var(--muted); background: var(--missing-bg); }
.tl { position: relative; margin: 0; padding: 0; list-style: none; }
.tl li { display: grid; grid-template-columns: 120px 18px 1fr; gap: 12px; padding: 0 0 18px; }
.tl .when { text-align: right; font-size: 13px; color: var(--muted); padding-top: 2px; }
.tl .when b { display: block; color: var(--ink); font-size: 14px; }
.tl .dot { position: relative; }
.tl .dot::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -18px; width: 2px; background: var(--rule); }
.tl li:last-child .dot::before { display: none; }
.tl .dot i { position: absolute; left: 3px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted); }
.tl li.done .dot i { background: var(--found); border-color: var(--found); }
.tl li.past_due .dot i { background: var(--del); border-color: var(--del); }
.tl li.at_risk .dot i { background: var(--conflict); border-color: var(--conflict); }
.tl li.today .dot i { background: var(--accent); border-color: var(--accent); }
.tl li.today .what { font-weight: 600; color: var(--accent); }
.tl .what .t { font-weight: 600; }
.tl .what .mini { margin-top: 2px; }
.ob { display: grid; grid-template-columns: 220px 1fr auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.ob:first-child { border-top: 0; }
.ob .win { font-weight: 700; }
@media (max-width: 640px) { .tl li { grid-template-columns: 84px 18px 1fr; } .ob { grid-template-columns: 1fr; gap: 4px; } }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .thread { grid-template-columns: 1fr; gap: 4px; } .crow { grid-template-columns: 40px 1fr; } .crow .flags { grid-column: 2; justify-content: flex-start; } .hero h1 { font-size: 26px; } }
</style>
</head>
<body>
{% if not embed %}
{% set ep = request.endpoint %}
<nav class="site" aria-label="Site"><div class="in">
  <a class="brand" href="{{ url_for('home') }}">Project Brain <span>&middot; Kilby</span></a>
  <a class="tab {{ 'on' if ep == 'card' }}" href="{{ url_for('card') }}">Record</a>
  <a class="tab {{ 'on' if ep == 'epc' }}" href="{{ url_for('epc') }}">EPC &amp; permitting</a>
  <a class="tab {{ 'on' if ep in ('permit_index', 'permit_condition') }}" href="{{ url_for('permit_index') }}">Draft permit</a>
  <a class="tab {{ 'on' if ep == 'consistency' }}" href="{{ url_for('consistency') }}">Consistency</a>
  <a class="tab {{ 'on' if ep == 'commitments' }}" href="{{ url_for('commitments') }}">Deadlines</a>
  <a class="tab {{ 'on' if ep == 'changes' }}" href="{{ url_for('changes') }}">What changed</a>
  <span class="sep"></span>
  <a class="tab {{ 'on' if ep == 'ask_view' }}" href="{{ url_for('ask_view') }}">Ask</a>
  <a class="tab {{ 'on' if ep == 'watch' }}" href="{{ url_for('watch') }}">Watcher</a>
  <a class="tab {{ 'on' if ep == 'eval_view' }}" href="{{ url_for('eval_view') }}">Eval</a>
</div></nav>
{% endif %}
<div class="wrap{% block wrapclass %}{% endblock %}">
{% block body %}{% endblock %}
</div>
</body>
</html>
